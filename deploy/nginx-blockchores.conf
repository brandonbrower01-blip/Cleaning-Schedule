# Optional: put nginx in front of BlockChores.
#
#   sudo cp deploy/nginx-blockchores.conf /etc/nginx/sites-available/blockchores
#   sudo ln -s /etc/nginx/sites-available/blockchores /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Serving plain HTTP on the home LAN is the simplest thing that works, and it
# keeps the old iPad happy. If you do add TLS, keep TLS 1.2 enabled: iOS 9
# cannot speak TLS 1.3, so a 1.3-only server will simply fail to load.

server {
    listen 80;
    listen [::]:80;
    server_name chores.lan;

    # The 1st gen iPad mini has 512 MB of RAM - keep responses small.
    gzip on;
    gzip_types text/css application/javascript application/json;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
